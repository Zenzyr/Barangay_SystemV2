name: barangay

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  barangay-mongo:
    image: mongo:7.0
    container_name: barangay-mongo
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-bims}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - barangay_mongo_data:/data/db
      - ./deploy/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - barangay-net
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet "mongodb://$$MONGO_APP_USERNAME:$$MONGO_APP_PASSWORD@127.0.0.1:27017/$$MONGO_APP_DATABASE?authSource=$$MONGO_APP_DATABASE" --eval "quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)"'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging: *default-logging

  barangay-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: barangay-server:latest
    container_name: barangay-server
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "5001"
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@barangay-mongo:27017/${MONGO_APP_DATABASE:-bims}?authSource=${MONGO_APP_DATABASE:-bims}
      CORS_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    volumes:
      - barangay_backups:/app/backups
    networks:
      - barangay-net
    depends_on:
      barangay-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M
    logging: *default-logging

  barangay-client:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL_LIVE: /bims
        NEXT_PUBLIC_BASE_URL_LIVE: ${PUBLIC_URL:?set PUBLIC_URL in .env}
        BACKEND_INTERNAL_URL: http://barangay-server:5001
    image: barangay-client:latest
    container_name: barangay-client
    restart: unless-stopped
    init: true
    environment:
      BACKEND_INTERNAL_URL: http://barangay-server:5001
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
    networks:
      - barangay-net
    depends_on:
      barangay-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *default-logging

  barangay-nginx:
    image: nginx:1.27-alpine
    container_name: barangay-nginx
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/barangay.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - barangay-net
    depends_on:
      barangay-client:
        condition: service_healthy
      barangay-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging

networks:
  barangay-net:
    name: barangay-net

volumes:
  barangay_mongo_data:
    name: barangay_mongo_data
  barangay_backups:
    name: barangay_backups
